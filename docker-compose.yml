services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tunas
      POSTGRES_PASSWORD: tunas
      POSTGRES_DB: tunas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunas -d tunas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: tunas-api:local
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tunas:tunas@postgres:5432/tunas
      MODEL_PATH: results/tabular/final/primary_model.json
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
      DEMO_SCOPE_KEY: ${DEMO_SCOPE_KEY:-posyandu-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD in .env}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-false}
    volumes:
      - ./:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
